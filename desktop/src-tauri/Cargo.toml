[package]
name = "vane-desktop"
version = "0.1.0"
description = "Desktop shell for Vane with a global shortcut and tray icon"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "vane_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico", "dynamic-acl"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
